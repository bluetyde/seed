<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">SEED architecture</title>
  <desc id="d">People, scripts and agents use the shell, the command line or the MCP server. All three go through one core that applies policy, oracles, the audit log and the study record. Adapters connect the core to the suite apps. Approvals use a separate human-only command line.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #c9d1d9; }
    .box { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
    .core { fill: #fff4dc; stroke: #b7791f; stroke-width: 2; }
    .app { fill: #e9f6ec; stroke: #2f855a; stroke-width: 1.5; }
    .human { fill: #fde8e8; stroke: #c53030; stroke-width: 1.5; }
    .t { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a202c; text-anchor: middle; }
    .s { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2d3748; text-anchor: middle; }
    .l { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a5568; text-anchor: middle; }
    .ar { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#h); }
    .dash { stroke: #c53030; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#hr); }
  </style>
  <defs>
    <marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="hr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="899" height="559" rx="10"/>

  <!-- who -->
  <rect class="box" x="40" y="24" width="220" height="56" rx="8"/>
  <text class="t" x="150" y="48">A person</text><text class="s" x="150" y="68">teaching, studying</text>
  <rect class="box" x="340" y="24" width="220" height="56" rx="8"/>
  <text class="t" x="450" y="48">A script</text><text class="s" x="450" y="68">CI, batch jobs</text>
  <rect class="box" x="640" y="24" width="220" height="56" rx="8"/>
  <text class="t" x="750" y="48">An AI agent</text><text class="s" x="750" y="68">through MCP</text>

  <!-- front ends -->
  <rect class="box" x="40" y="130" width="220" height="62" rx="8"/>
  <text class="t" x="150" y="156">Shell window</text><text class="s" x="150" y="176">the suite apps as tabs</text>
  <rect class="box" x="340" y="130" width="220" height="62" rx="8"/>
  <text class="t" x="450" y="156">Command line</text><text class="s" x="450" y="176">seed:cli</text>
  <rect class="box" x="640" y="130" width="220" height="62" rx="8"/>
  <text class="t" x="750" y="156">MCP server</text><text class="s" x="750" y="176">seed:mcp</text>
  <path class="ar" d="M150 80 V128"/><path class="ar" d="M450 80 V128"/><path class="ar" d="M750 80 V128"/>

  <!-- core -->
  <rect class="core" x="40" y="250" width="820" height="130" rx="10"/>
  <text class="t" x="450" y="276">One core: every front end goes through the same rules</text>
  <text class="s" x="170" y="312">Gate</text><text class="l" x="170" y="332">tier, budget,</text><text class="l" x="170" y="348">bounds, grants</text>
  <text class="s" x="330" y="312">Oracles</text><text class="l" x="330" y="332">known-answer checks,</text><text class="l" x="330" y="348">pinned by hash</text>
  <text class="s" x="500" y="312">Audit log</text><text class="l" x="500" y="332">every decision and</text><text class="l" x="500" y="348">outcome, chained</text>
  <text class="s" x="665" y="312">Study record</text><text class="l" x="665" y="332">steps and notes,</text><text class="l" x="665" y="348">hash-chained</text>
  <text class="s" x="808" y="312">Reports</text><text class="l" x="808" y="332">re-verify every</text><text class="l" x="808" y="348">run they cite</text>
  <path class="ar" d="M150 192 V248"/><path class="ar" d="M450 192 V248"/><path class="ar" d="M750 192 V248"/>

  <!-- adapters -->
  <rect class="box" x="260" y="430" width="600" height="40" rx="8"/>
  <text class="t" x="560" y="455">Adapters: thin, one per app, one contract</text>
  <path class="ar" d="M560 380 V428"/>

  <!-- apps -->
  <rect class="app" x="260" y="500" width="108" height="44" rx="8"/><text class="s" x="314" y="527">OpenMC Studio</text>
  <rect class="app" x="383" y="500" width="108" height="44" rx="8"/><text class="s" x="437" y="527">NODAL</text>
  <rect class="app" x="506" y="500" width="108" height="44" rx="8"/><text class="s" x="560" y="527">RAFT</text>
  <rect class="app" x="629" y="500" width="108" height="44" rx="8"/><text class="s" x="683" y="527">SNEED</text>
  <rect class="app" x="752" y="500" width="108" height="44" rx="8"/><text class="s" x="806" y="527">FEED</text>
  <path class="ar" d="M314 470 V498"/><path class="ar" d="M437 470 V498"/><path class="ar" d="M560 470 V498"/><path class="ar" d="M683 470 V498"/><path class="ar" d="M806 470 V498"/>

  <!-- human only -->
  <rect class="human" x="40" y="418" width="190" height="70" rx="8"/>
  <text class="t" x="135" y="445">Human-only admin</text>
  <text class="l" x="135" y="465">approvals, clearances;</text><text class="l" x="135" y="480">agents have no verb for these</text>
  <path class="dash" d="M135 418 V384"/>
</svg>
